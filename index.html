<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <form action="" method="post" class="formContainer">
            <h2>Login</h2>
            <div class="emailContainer">
                <label for="email">Email</label>
                <input type="email" name="email" id="email" class="email" placeholder="Enter Email" required>
            </div>
            <div class="passwordContainer">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" class="password" placeholder="Enter Password" required minlength="8">
            </div>
            <div class="forgotPassword">
                <a href="#" class="passwordLink">Forgot Password</a>
            </div>
            <div class="buttonContainer">
                <button type="submit" id="submitBtn" class="submitBtn">Login</button>
            </div>
        </form>
    </div>
</body>
</html>
