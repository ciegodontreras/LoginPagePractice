<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <!-- Contianer for the singin/signup forms -->
    <div class="panelOne" id="panelOne">
        <form action="" method="post" class="signInForm" id="signInForm">
            <h1>Sign In</h1>
            <input type="email" name="emailSI" id="emailSI" placeholder="Email" required>
            <input type="password" name="passwordSI" id="passwordSI" placeholder="Password" required>
            <a href="" class="forgotPassword">Forgot your Password?</a>
            <button type="submit">SIGN IN</button>
        </form>
        <form action="" method="post" class="signUpForm hidden" id="signUpForm">
            <h1>Create Account</h1>
            <input type="text" name="firstName" id="firstName" class="firstName" placeholder="First Name" required>
            <input type="text" name="lastName" id="lastName" class="lastName" placeholder="Last Name" required>
            <input type="email" name="email" id="email" class="email" placeholder="Email" required>
            <input type="password" name="password" id="password" class="password" placeholder="Password" required>
            <input type="password" name="passwordVerification" id="passwordVerification" class="passwordVerification" placeholder="Verify Password" required>
            <button type="submit">SIGN UP</button>
        </form>
    </div>
    <!-- Container for button used to switch between singin/singup -->
    <div class="panelTwo" id="panelTwo"></div>
    <div class="panelThree" id="panelThree">
        <div class="alreadyHaveAccountContainer hidden" id="alreadyHaveAccountContainer">
            <h1>Welcome Back</h1>
            <button type="button" id="alreadyHaveAccountBtn">SIGN IN</button>
        </div>
    </div>
    <div class="panelFour" id="panelFour">
        <div class="createAccountContainer" id="createAccountContainer">
            <h1>Create an Account</h1>
            <button type="button" id="createAccountBtn" class="createAccountBtn">SIGN UP</button>
        </div>
    </div>
</body>
</html>
